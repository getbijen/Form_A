<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Navyakritibyamita - Stay in touch</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .page {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 384px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: 27px 19px 18px;
    }

    .content {
      flex: 1;
    }

    .brand {
      margin: 10px 0 22px;
      color: #0e625b;
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.3px;
      line-height: 1.2;
      text-align: center;
    }

    .brand img {
      display: block;
      width: 96px;
      height: 96px;
      margin: 0 auto 10px;
      border: 2px solid #e7efed;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      margin: 0 0 17px;
      font-size: 23px;
      font-weight: 700;
      line-height: 1.25;
    }

    .intro {
      margin: 0 0 20px;
      color: #555;
      font-size: 14px;
      line-height: 1.55;
    }

    .field {
      margin: 0 0 19px;
    }

    .field label {
      display: block;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 16px;
    }

    .field input {
      display: block;
      width: 100%;
      height: 45px;
      padding: 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font: inherit;
      font-size: 14px;
    }

    .field input::placeholder {
      color: #777;
      opacity: 1;
    }

    .phone-input {
      display: flex;
      align-items: center;
      height: 45px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .phone-prefix {
      padding-left: 12px;
      color: #555;
      font-size: 14px;
    }

    .field .phone-input input {
      min-width: 0;
      height: 100%;
      border: 0;
      outline-offset: -2px;
    }

    .hint {
      margin: 6px 0 0;
      color: #777;
      font-size: 12px;
      line-height: 16px;
    }

    .field input:focus-visible,
    .consent input:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid #0e625b;
      outline-offset: 2px;
    }

    .phone-input:focus-within {
      border-color: #0e625b;
      outline: 2px solid #0e625b;
      outline-offset: 2px;
    }

    .field .phone-input input:focus-visible {
      outline: none;
    }

    .consents {
      display: grid;
      gap: 18px;
      margin: 2px 0 18px;
    }

    .consent {
      display: grid;
      grid-template-columns: 16px 1fr;
      align-items: start;
      gap: 13px;
      font-size: 13px;
      line-height: 18px;
    }

    .consent input {
      width: 14px;
      height: 14px;
      margin: 2px 0 0 4px;
      accent-color: #0e625b;
    }

    .privacy {
      margin: 0;
      color: #777;
      font-size: 12px;
      line-height: 18px;
    }

    .privacy a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    button {
      width: 100%;
      min-height: 53px;
      border: 0;
      border-radius: 11px;
      background: #0e625b;
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    #form-message {
      margin: 10px 0 0;
      color: #9a3412;
      font-size: 13px;
      line-height: 18px;
    }

    .thank-you {
      margin-top: 22px;
      padding: 18px 16px;
      border: 1px solid #dfe9e5;
      border-radius: 14px;
      background: #f5faf8;
      color: #113b35;
      font-size: 17px;
      line-height: 1.5;
      text-align: center;
    }

    @media (min-width: 600px) {
      .page {
        min-height: 832px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="content">
      <p class="brand">
        <img src="stall-photo.png" alt="Navyakritibyamita stall">
        Navyakritibyamita
      </p>
      <h1>Thanks for visiting our stall.</h1>
      <p class="intro">Leave your details to claim 5% discount and we'll share new arrivals and offers. You can opt out anytime.</p>

      <form id="contact-form">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your name" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="mobile">WhatsApp number</label>
          <div class="phone-input">
            <span class="phone-prefix" aria-hidden="true">+91</span>
            <input id="mobile" name="mobile" type="tel" placeholder="10-digit number" autocomplete="tel-national" inputmode="numeric" pattern="[0-9]{10}" minlength="10" maxlength="10" title="Enter exactly 10 digits after +91." aria-describedby="mobile-hint" required>
          </div>
          <p class="hint" id="mobile-hint">Enter a 10-digit number after +91.</p>
        </div>

        <div class="field">
          <label for="email">Email (optional)</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email">
        </div>

        <div class="consents">
          <label class="consent">
            <input type="checkbox" name="whatsapp-updates">
            <span>Send me WhatsApp messages about offers and new stock.</span>
          </label>
          <label class="consent">
            <input type="checkbox" name="email-updates">
            <span>Send me emails about offers and new stock.</span>
          </label>
        </div>
      </form>

      <div id="thank-you-message" class="thank-you" hidden></div>

      <p class="privacy">Your details are used only by Navyakritibyamita and are deleted on request. <a href="#privacy-notice">Privacy notice</a></p>
      <p id="form-message" role="status" aria-live="polite" hidden></p>
    </div>

    <button type="submit" form="contact-form">Submit</button>
  </main>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwX7I-WFTJ67_2vzgolFpB-4q-1auqjcuKMhU_KwCiKiMgA9htyI6NlJCwtj4reSNtP/exec";
    const form = document.getElementById("contact-form");
    const message = document.getElementById("form-message");
    const thankYouMessage = document.getElementById("thank-you-message");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const fullName = document.getElementById("name").value.trim();
      const firstName = fullName.split(/\s+/)[0] || "there";

      const data = new URLSearchParams({
      name: fullName,
      whatsapp: "+91" + document.getElementById("mobile").value,
      email: document.getElementById("email").value,
      consent_whatsapp: document.querySelector('input[name="whatsapp-updates"]').checked ? "yes" : "no",
      consent_email: document.querySelector('input[name="email-updates"]').checked ? "yes" : "no",
      consent_version: "v1"
});

fetch(APPS_SCRIPT_URL, {
  method: "POST",
  mode: "no-cors",
  body: data
});

      thankYouMessage.textContent = `Hi ${firstName}, thank you for visiting our stall. It was great meeting you.`;
      thankYouMessage.hidden = false;

      form.hidden = true;
      document.querySelector(".intro").hidden = true;
      document.querySelector(".privacy").hidden = true;
      document.querySelector("button[form='contact-form']").hidden = true;
      message.hidden = true;
    });

    document.querySelector(".privacy a").addEventListener("click", function (event) {
      event.preventDefault();
      message.textContent = "Your details are used only by Navyakritibyamita and can be deleted on request.";
      message.hidden = false;
    });
  </script>
</body>
</html>
